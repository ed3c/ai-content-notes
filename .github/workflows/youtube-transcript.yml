name: YouTube transcript evidence

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Single authorized YouTube video URL
        required: true
        type: string
      mode:
        description: Captions on GitHub-hosted CPU or ASR on an authorized self-hosted GPU
        required: true
        default: captions
        type: choice
        options:
          - captions
          - asr
      languages:
        description: Caption language preference, comma separated
        required: true
        default: en,zh-Hant,zh-TW,zh
        type: string
      rights_basis:
        description: Legal/contractual basis for acquisition
        required: true
        type: choice
        options:
          - owned
          - licensed
          - creator-permission
          - public-domain
          - user-provided-media
      rights_reference:
        description: Internal permission/license/ownership record; never a secret
        required: true
        type: string
      asr_language:
        description: ASR language code or auto
        required: true
        default: auto
        type: string
      asr_model:
        description: Reviewed faster-whisper model
        required: true
        default: large-v3
        type: choice
        options:
          - large-v3
      asr_model_revision:
        description: Pinned Hugging Face model Git revision
        required: true
        default: edaa852ec7e145841d8ffdb056a99866b5f0a478
        type: string

permissions:
  contents: read

concurrency:
  group: youtube-transcript-${{ inputs.mode }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OUTPUT_DIR: transcript-evidence

jobs:
  captions:
    if: ${{ inputs.mode == 'captions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_VIDEO_URL: ${{ inputs.video_url }}
      INPUT_LANGUAGES: ${{ inputs.languages }}
      INPUT_RIGHTS_BASIS: ${{ inputs.rights_basis }}
      INPUT_RIGHTS_REFERENCE: ${{ inputs.rights_reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-youtube-transcript.txt
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt -r requirements-youtube-transcript.txt
      - name: Acquire caption evidence
        id: acquire
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/youtube_transcript.py \
            --url "$INPUT_VIDEO_URL" \
            --output-dir "$OUTPUT_DIR" \
            --mode captions \
            --languages "$INPUT_LANGUAGES" \
            --rights-basis "$INPUT_RIGHTS_BASIS" \
            --rights-reference "$INPUT_RIGHTS_REFERENCE" \
            --attested-by "github:$GITHUB_ACTOR"
      - name: Validate manifest when present
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$OUTPUT_DIR/manifest.json"; then
            python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/youtube-transcript-manifest.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("transcript-evidence/manifest.json").read_text(encoding="utf-8"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)
          PY
          else
            echo "manifest.json was not materialized" >&2
            exit 1
          fi
      - name: Upload private evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-transcript-${{ github.run_id }}
          path: transcript-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve blocked acquisition as job failure
        if: ${{ steps.acquire.outcome == 'failure' }}
        run: exit 1

  asr:
    if: ${{ inputs.mode == 'asr' }}
    runs-on: [self-hosted, linux, x64, gpu, youtube-transcript]
    timeout-minutes: 180
    env:
      INPUT_VIDEO_URL: ${{ inputs.video_url }}
      INPUT_RIGHTS_BASIS: ${{ inputs.rights_basis }}
      INPUT_RIGHTS_REFERENCE: ${{ inputs.rights_reference }}
      INPUT_ASR_LANGUAGE: ${{ inputs.asr_language }}
      INPUT_ASR_MODEL: ${{ inputs.asr_model }}
      INPUT_ASR_MODEL_REVISION: ${{ inputs.asr_model_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-youtube-transcript-asr.txt
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt -r requirements-youtube-transcript-asr.txt
      - name: Acquire ASR evidence
        id: acquire
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/youtube_transcript.py \
            --url "$INPUT_VIDEO_URL" \
            --output-dir "$OUTPUT_DIR" \
            --mode asr \
            --allow-audio-download \
            --asr-language "$INPUT_ASR_LANGUAGE" \
            --asr-model "$INPUT_ASR_MODEL" \
            --asr-model-revision "$INPUT_ASR_MODEL_REVISION" \
            --asr-device cuda \
            --asr-compute-type float16 \
            --rights-basis "$INPUT_RIGHTS_BASIS" \
            --rights-reference "$INPUT_RIGHTS_REFERENCE" \
            --attested-by "github:$GITHUB_ACTOR"
      - name: Validate manifest when present
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$OUTPUT_DIR/manifest.json"; then
            python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("schemas/youtube-transcript-manifest.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("transcript-evidence/manifest.json").read_text(encoding="utf-8"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)
          PY
          else
            echo "manifest.json was not materialized" >&2
            exit 1
          fi
      - name: Upload private evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-transcript-asr-${{ github.run_id }}
          path: transcript-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve blocked acquisition as job failure
        if: ${{ steps.acquire.outcome == 'failure' }}
        run: exit 1
