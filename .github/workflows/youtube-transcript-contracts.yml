name: YouTube transcript contracts

on:
  pull_request:
    paths:
      - tools/youtube_transcript.py
      - schemas/youtube-transcript-manifest.schema.json
      - tests/test_youtube_transcript.py
      - requirements-youtube-transcript*.txt
      - docs/YOUTUBE_TRANSCRIPT_PIPELINE.md
      - .github/workflows/youtube-transcript*.yml
  push:
    branches: [main]
    paths:
      - tools/youtube_transcript.py
      - schemas/youtube-transcript-manifest.schema.json
      - tests/test_youtube_transcript.py
      - requirements-youtube-transcript*.txt
      - docs/YOUTUBE_TRANSCRIPT_PIPELINE.md
      - .github/workflows/youtube-transcript*.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt
      - run: ruff check tools/youtube_transcript.py tests/test_youtube_transcript.py
      - run: python -m py_compile tools/youtube_transcript.py tests/test_youtube_transcript.py
      - run: pytest -q tests/test_youtube_transcript.py
      - name: Assert CLI exposes no bypass interface
        run: |
          python tools/youtube_transcript.py --help > /tmp/help.txt
          ! grep -Eqi -- '--(cookie|proxy|po[-_]?token|impersonat)' /tmp/help.txt
