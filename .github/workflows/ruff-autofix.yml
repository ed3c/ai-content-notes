name: One-shot Ruff autofix

on:
  pull_request:
    paths:
      - tools/**
      - tests/**
      - .github/workflows/ruff-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-contracts.txt
      - run: ruff check tools tests --fix
      - name: Commit source fixes when required
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools tests
          git commit -m "style: apply Ruff fixes"
          git push origin HEAD:${{ github.head_ref }}
