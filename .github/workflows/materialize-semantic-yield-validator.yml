name: Materialize semantic-yield validator

on:
  push:
    branches: [agent/semantic-yield-validator]
    paths:
      - '.bootstrap/semantic-validator/**'
      - '.bootstrap/semantic-validator-overlay-manifest.json'
      - '.github/workflows/materialize-semantic-yield-validator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Verify and materialize digest-bound overlay
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            b2b11781017a57836454d94d6c9c622c74911947 HEAD

          python - <<'PY'
          import base64
          import hashlib
          import json
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          manifest_path = (
              root / '.bootstrap/semantic-validator-overlay-manifest.json'
          )
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          encoded = bytearray()
          for contract in manifest['archive']['chunks']:
              chunk = root / contract['path']
              payload = chunk.read_bytes()
              actual = 'sha256:' + hashlib.sha256(payload).hexdigest()
              if actual != contract['sha256'] or len(payload) != contract['bytes']:
                  raise SystemExit(
                      f"base64 chunk contract mismatch: {contract['path']}"
                  )
              encoded.extend(payload)
          if len(encoded) != manifest['archive']['base64_bytes']:
              raise SystemExit('base64 byte count mismatch')

          archive = Path('/tmp/semantic-validator-overlay.tar.gz')
          archive.write_bytes(base64.b64decode(bytes(encoded), validate=True))
          archive_payload = archive.read_bytes()
          actual_archive = 'sha256:' + hashlib.sha256(
              archive_payload
          ).hexdigest()
          if (
              actual_archive != manifest['archive']['sha256']
              or len(archive_payload) != manifest['archive']['bytes']
          ):
              raise SystemExit('semantic validator archive contract mismatch')

          expected = {item['path']: item for item in manifest['files']}
          extract_root = Path('/tmp/semantic-validator-overlay')
          shutil.rmtree(extract_root, ignore_errors=True)
          extract_root.mkdir(parents=True)

          with tarfile.open(archive, 'r:gz') as tar:
              file_members = []
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or '..' in path.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  if member.isfile():
                      file_members.append(member.name)
              if set(file_members) != set(expected):
                  missing = sorted(set(expected) - set(file_members))
                  extra = sorted(set(file_members) - set(expected))
                  raise SystemExit(
                      f'archive file set mismatch; missing={missing}, extra={extra}'
                  )
              tar.extractall(extract_root, filter='data')

          for rel, contract in expected.items():
              source = extract_root / rel
              data = source.read_bytes()
              actual = 'sha256:' + hashlib.sha256(data).hexdigest()
              if actual != contract['sha256'] or len(data) != contract['bytes']:
                  raise SystemExit(f'file contract mismatch: {rel}')
              destination = root / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          print(json.dumps({
              'archive_sha256': actual_archive,
              'materialized_file_count': len(expected),
              'target_branch': manifest['target_branch'],
          }, sort_keys=True))
          PY

          rm -rf .bootstrap
          rm -f .github/workflows/materialize-semantic-yield-validator.yml

      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-contracts.txt

      - name: Validate semantic-yield artifacts
        shell: bash
        run: |
          set -euo pipefail
          ruff check tools tests
          python -m py_compile \
            tools/validate_semantic_yield_artifacts.py \
            tests/test_semantic_yield_validator.py
          pytest -q

          python tools/validate_semantic_yield_artifacts.py \
            --target evals/semantic-yield/CvRngaQZQ3Y \
            --output evals/semantic-yield/CvRngaQZQ3Y/semantic-validator-report.json \
            --created-at 2026-08-14T01:15:00Z \
            --check

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  'evals/semantic-yield/CvRngaQZQ3Y/'
                  'semantic-validator-report.json'
              ).read_text(encoding='utf-8')
          )
          assert report['overall_status'] == (
              'PASS_WITH_DEFERRED_VISUAL_AND_PARTIAL_QG'
          )
          assert report['hg']['HG-03']['status'] == 'DEFERRED'
          assert len(report['qg_subset']) == 10
          assert report['failures'] == []
          PY

          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m \
            'feat: add deterministic semantic-yield artifact validator'
          git push origin HEAD:agent/semantic-yield-validator
