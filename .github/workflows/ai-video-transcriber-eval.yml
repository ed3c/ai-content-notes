name: AI-Video-Transcriber evidence evaluation

on:
  push:
    branches:
      - agent/ai-video-transcriber-cvrngaqzq3y
    paths:
      - .github/workflows/ai-video-transcriber-eval.yml
      - tools/ai_video_transcriber_adapter.py
      - tests/test_ai_video_transcriber_adapter.py
      - schemas/ai-video-transcriber-evidence.schema.json
      - schemas/source-manifest.schema.json
      - governance/CARD_PROTOCOL_V7_1.md
      - governance/TRANSCRIPT_BACKENDS.json
  workflow_dispatch:
    inputs:
      video_url:
        description: Single YouTube video URL
        required: true
        default: https://www.youtube.com/watch?v=CvRngaQZQ3Y
        type: string
      authorization_status:
        description: Verified rights or private evaluation only
        required: true
        default: unverified-evaluation-only
        type: choice
        options:
          - unverified-evaluation-only
          - verified
      rights_basis:
        description: Use user-directed-evaluation unless verified rights are documented
        required: true
        default: user-directed-evaluation
        type: string
      rights_reference:
        description: Reviewable non-secret reference
        required: true
        default: chat-request-2026-08-13:CvRngaQZQ3Y
        type: string

permissions:
  contents: read

concurrency:
  group: ai-video-transcriber-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  DEFAULT_VIDEO_URL: https://www.youtube.com/watch?v=CvRngaQZQ3Y
  UPSTREAM_COMMIT: ade833b790d482f7a5c0a722c67bc33f71e9d2b5
  OUTPUT_DIR: transcript-evidence

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out AI Content Notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned AI-Video-Transcriber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wendy7756/AI-Video-Transcriber
          ref: ade833b790d482f7a5c0a722c67bc33f71e9d2b5
          path: vendor/AI-Video-Transcriber
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-contracts.txt
            requirements-youtube-transcript.txt

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt -r requirements-youtube-transcript.txt
      - run: python -m py_compile tools/ai_video_transcriber_adapter.py tests/test_ai_video_transcriber_adapter.py
      - run: pytest -q tests/test_ai_video_transcriber_adapter.py

      - name: Acquire review-only transcript candidate
        id: acquire
        continue-on-error: true
        shell: bash
        env:
          INPUT_VIDEO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.video_url || 'https://www.youtube.com/watch?v=CvRngaQZQ3Y' }}
          INPUT_AUTHORIZATION_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization_status || 'unverified-evaluation-only' }}
          INPUT_RIGHTS_BASIS: ${{ github.event_name == 'workflow_dispatch' && inputs.rights_basis || 'user-directed-evaluation' }}
          INPUT_RIGHTS_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rights_reference || 'chat-request-2026-08-13:CvRngaQZQ3Y' }}
        run: |
          set -euo pipefail
          python tools/ai_video_transcriber_adapter.py \
            --url "$INPUT_VIDEO_URL" \
            --output-dir "$OUTPUT_DIR" \
            --upstream-root vendor/AI-Video-Transcriber \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --prompt-path governance/CARD_PROTOCOL_V7_1.md \
            --languages en,zh-Hant,zh-TW,zh,ja \
            --authorization-status "$INPUT_AUTHORIZATION_STATUS" \
            --rights-basis "$INPUT_RIGHTS_BASIS" \
            --rights-reference "$INPUT_RIGHTS_REFERENCE" \
            --attested-by "github:$GITHUB_ACTOR"

      - name: Validate evidence manifests
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          root = Path("transcript-evidence")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/ai-video-transcriber-evidence.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(manifest)

          source_manifest = root / "source-manifest.json"
          if manifest["status"] == "needs-review":
              if not source_manifest.is_file():
                  raise SystemExit("successful acquisition did not materialize source-manifest.json")
              source = json.loads(source_manifest.read_text(encoding="utf-8"))
              source_schema = json.loads(Path("schemas/source-manifest.schema.json").read_text(encoding="utf-8"))
              Draft202012Validator(source_schema, format_checker=FormatChecker()).validate(source)
          PY

      - name: Upload private evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-video-transcriber-CvRngaQZQ3Y-${{ github.run_id }}
          path: transcript-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve blocked acquisition as job failure
        if: ${{ steps.acquire.outcome == 'failure' }}
        run: exit 1
