name: Canonical contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt
      - run: ruff check tools tests
      - name: Verify the v2 batch registry reconciles without a gap
        run: |
          python tools/reconcile_card_registry.py \
            --cards evals/semantic-yield/CvRngaQZQ3Y-v2/cards \
            --source-id youtube-video:cvrngaqzq3y \
            --source-digest sha256:304e9a058721298f7498906d2539fdabdac515f2304645d52824e6719bc5f9bf \
            --updated-at 2026-08-15T00:30:00Z \
            --output evals/semantic-yield/CvRngaQZQ3Y-v2/card-registry.json \
            --check
      - name: Verify the recorded card-registry gap has not drifted
        run: |
          python tools/reconcile_card_registry.py \
            --cards evals/semantic-yield/CvRngaQZQ3Y/cards \
            --source-id youtube-video:cvrngaqzq3y \
            --source-digest sha256:bf993b8d98717284f58139bfa93955b1bbfcb0128ca386b1913e98d2a4eef462 \
            --updated-at 2026-08-14T02:00:00Z \
            --gap-report evals/semantic-yield/CvRngaQZQ3Y/card-registry-gap-report.json \
            --check
      - run: >-
          python -m py_compile
          tools/export_note_delta.py
          tools/evaluate_prompt_ab.py
          tools/validate_semantic_yield_artifacts.py
          tools/materialize_legacy_migration.py
          tests/test_contracts.py
          tests/test_legacy_migration.py
          tests/test_prompt_v7_1_ab.py
          tests/test_semantic_yield_validator.py
      - run: pytest -q
      - name: Verify the rights allowlist denies by default
        run: |
          python tools/rights_allowlist.py \
            --allowlist governance/RIGHTS_ALLOWLIST.json \
            --video-id CvRngaQZQ3Y \
            --backend creator-caption \
            --as-of 2026-08-14 > /tmp/rights-decisions.json
          python - <<'PY'
          import json
          decisions = json.load(open("/tmp/rights-decisions.json"))["decisions"]
          assert all(item["decision"] == "blocked" for item in decisions), decisions
          PY
      - name: Verify persisted v7.0 versus v7.1 replay result
        run: |
          python tools/evaluate_prompt_ab.py \
            --fixture evals/prompt-ab/v7_0-v7_1/fixture.json \
            --output-a evals/prompt-ab/v7_0-v7_1/output-a-v7.0.md \
            --output-b evals/prompt-ab/v7_0-v7_1/output-b-v7.1.md \
            --run evals/prompt-ab/v7_0-v7_1/run.json \
            --output evals/prompt-ab/v7_0-v7_1/result.json \
            --check
      - name: Verify every retained subject artifact is bound
        run: python tools/verify_source_retention.py
      - name: Verify persisted Stage 3 product-signal packet matches compiler output
        run: |
          python tools/product_signal.py \
            --claims evals/product-signal/modern-web-architecture/claims.jsonl \
            --evidence evals/product-signal/modern-web-architecture/evidence-ledger.json \
            --contradictions evals/product-signal/modern-web-architecture/contradictions.json \
            --source-registry evals/source-intake/modern-web-architecture/source-registry.json \
            --output evals/product-signal/modern-web-architecture/product-signal.json \
            --check
      - name: Verify persisted Stage 3 read-back receipt matches recomputed identity
        run: |
          python tools/product_signal_readback.py \
            --packet-dir evals/product-signal/modern-web-architecture \
            --source-registry evals/source-intake/modern-web-architecture/source-registry.json \
            --output evals/product-signal/modern-web-architecture/readback-receipt.json \
            --check
      - name: Verify persisted semantic-yield validator report
        run: |
          python tools/validate_semantic_yield_artifacts.py \
            --target evals/semantic-yield/CvRngaQZQ3Y \
            --output evals/semantic-yield/CvRngaQZQ3Y/semantic-validator-report.json \
            --created-at 2026-08-14T01:15:00Z \
            --check
      - name: Verify materialized legacy notes against the pinned payload
        run: |
          python tools/materialize_legacy_migration.py \
            --scratch "${RUNNER_TEMP}/migration-scratch" \
            --check
      - name: Export deterministic privacy-preserving delta
        run: |
          python tools/export_note_delta.py \
            --note notes/agent-runtime/2026-07-30-langsmith-llm-gateway-runtime-controls.md \
            --claim-map examples/claim-maps/langsmith-llm-gateway.claim-map.json \
            --source-commit "$GITHUB_SHA" \
            --readback-verified \
            --check \
            --output /tmp/note-delta.json
          test -s /tmp/note-delta.json
          ! grep -q '### N1' /tmp/note-delta.json
          ! grep -q '核心衝突' /tmp/note-delta.json
