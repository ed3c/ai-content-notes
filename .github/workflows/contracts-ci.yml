name: Canonical contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-contracts.txt
      - run: ruff check tools tests
      - run: >-
          python -m py_compile
          tools/export_note_delta.py
          tools/evaluate_prompt_ab.py
          tools/validate_semantic_yield_artifacts.py
          tools/parse_compiler_channels.py
          tests/test_contracts.py
          tests/test_compiler_channels.py
          tests/test_prompt_v7_1_ab.py
          tests/test_semantic_yield_validator.py
      - run: pytest -q
      - name: Verify persisted v7.0 versus v7.1 replay result
        run: |
          python tools/evaluate_prompt_ab.py \
            --fixture evals/prompt-ab/v7_0-v7_1/fixture.json \
            --output-a evals/prompt-ab/v7_0-v7_1/output-a-v7.0.md \
            --output-b evals/prompt-ab/v7_0-v7_1/output-b-v7.1.md \
            --run evals/prompt-ab/v7_0-v7_1/run.json \
            --output evals/prompt-ab/v7_0-v7_1/result.json \
            --check
      - name: Verify persisted semantic-yield validator report
        run: |
          python tools/validate_semantic_yield_artifacts.py \
            --target evals/semantic-yield/CvRngaQZQ3Y \
            --output evals/semantic-yield/CvRngaQZQ3Y/semantic-validator-report.json \
            --created-at 2026-08-14T01:15:00Z \
            --check
      - name: Export deterministic privacy-preserving delta
        run: |
          python tools/export_note_delta.py \
            --note notes/agent-runtime/2026-07-30-langsmith-llm-gateway-runtime-controls.md \
            --claim-map examples/claim-maps/langsmith-llm-gateway.claim-map.json \
            --source-commit "$GITHUB_SHA" \
            --readback-verified \
            --check \
            --output /tmp/note-delta.json
          test -s /tmp/note-delta.json
          ! grep -q '### N1' /tmp/note-delta.json
          ! grep -q '核心衝突' /tmp/note-delta.json
