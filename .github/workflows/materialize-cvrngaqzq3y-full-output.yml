name: Verify CvRngaQZQ3Y complete v7.1 output

on:
  pull_request:
    paths:
      - evals/live/CvRngaQZQ3Y/**
      - tools/materialize_card_batch.py
      - tests/test_live_cvrngaqzq3y_v7_1.py
      - .github/workflows/materialize-cvrngaqzq3y-full-output.yml
  push:
    branches:
      - agent/ai-video-transcriber-cvrngaqzq3y
    paths:
      - evals/live/CvRngaQZQ3Y/**
      - tools/materialize_card_batch.py
      - tests/test_live_cvrngaqzq3y_v7_1.py
      - .github/workflows/materialize-cvrngaqzq3y-full-output.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install -r requirements-contracts.txt
      - name: Verify deterministic complete output
        run: |
          python tools/materialize_card_batch.py \
            --manifest evals/live/CvRngaQZQ3Y/card-manifest.json \
            --output /tmp/CvRngaQZQ3Y-v7.1.md \
            --check
          cmp /tmp/CvRngaQZQ3Y-v7.1.md \
            evals/live/CvRngaQZQ3Y/card-output-v7.1.md
          pytest -q tests/test_live_cvrngaqzq3y_v7_1.py
