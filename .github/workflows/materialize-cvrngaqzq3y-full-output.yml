name: Persist CvRngaQZQ3Y complete v7.1 output

on:
  push:
    branches: [agent/ai-video-transcriber-cvrngaqzq3y]
    paths: [.github/workflows/materialize-cvrngaqzq3y-full-output.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install -r requirements-contracts.txt
      - name: Restore card blobs and materialize output
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path("evals/live/CvRngaQZQ3Y")
          blobs = {
              "card-output-v7.1.part-03b.md": "a768bdb4f270954c3074dd07ff0cb20e11c9c73b",
              "card-output-v7.1.part-04.md": "027a7196392acdce3234d0ee0ee376f4dac33beb",
              "card-output-v7.1.part-05.md": "00d712deeff703f80e6194319ed2571508fdf80d",
              "card-output-v7.1.part-06a.md": "4882299d4e464683a00ee3d12f56cfa9ddfa99c8",
              "card-output-v7.1.part-06b.md": "8081dcb90e4c37847489905d8f824e57fec0e074",
              "run-state.md": "2b8f63763faec6d2c43ea9fc9f8c30a1d2c81948",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ai-content-notes-materializer",
          }
          for name, sha in blobs.items():
              url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}"
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  payload = base64.b64decode(json.load(response)["content"])
              git_sha = hashlib.sha1(f"blob {len(payload)}\0".encode() + payload).hexdigest()
              if git_sha != sha:
                  raise SystemExit(f"blob mismatch: {name}")
              payload.decode("utf-8")
              (root / name).write_bytes(payload)

          for temporary in (root / "write-check.txt", root / "cards/C-continual-learning-state-planes.md"):
              temporary.unlink(missing_ok=True)

          names = [
              "card-output-v7.1.part-01.md", "card-output-v7.1.part-02.md",
              "card-output-v7.1.part-03a.md", "card-output-v7.1.part-03b.md",
              "card-output-v7.1.part-04.md", "card-output-v7.1.part-05.md",
              "card-output-v7.1.part-06a.md", "card-output-v7.1.part-06b.md",
          ]
          parts, entries, card_ids = [], [], []
          for name in names:
              path = root / name
              payload = path.read_bytes()
              text = payload.decode("utf-8")
              ids = re.findall(r"^###\s+([A-Z][A-Za-z0-9._:-]*)｜", text, re.MULTILINE)
              if not ids:
                  raise SystemExit(f"missing card: {name}")
              parts.append(text.rstrip())
              card_ids += ids
              entries.append({"path": path.as_posix(), "sha256": hashlib.sha256(payload).hexdigest(), "bytes": len(payload), "card_ids": ids})

          run_state_path = root / "run-state.md"
          run_state_payload = run_state_path.read_bytes()
          rendered = "\n\n".join(parts + [run_state_payload.decode().rstrip()]) + "\n"
          output_path = root / "card-output-v7.1.md"
          output_path.write_text(rendered, encoding="utf-8")
          output_payload = rendered.encode()
          digest = hashlib.sha256(output_payload).hexdigest()

          manifest_path = root / "card-manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest.update({
              "parts": entries,
              "run_state_path": run_state_path.as_posix(),
              "run_state_sha256": hashlib.sha256(run_state_payload).hexdigest(),
              "card_count": len(card_ids),
              "card_order": card_ids,
              "series_order": [card_id.split("-", 1)[0] for card_id in card_ids],
              "logical_output_sha256": digest,
              "logical_output_bytes": len(output_payload),
              "complete_output": {"path": output_path.as_posix(), "sha256": digest, "bytes": len(output_payload), "committed": True, "raw_transcript_included": False},
              "status": "CONTINUE",
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")

          run_path = root / "run.json"
          run = json.loads(run_path.read_text())
          run["output"] = {"path": output_path.as_posix(), "sha256": digest, "bytes": len(output_payload), "card_count": len(card_ids), "card_manifest_path": manifest_path.as_posix(), "part_paths": [str(root / name) for name in names], "run_state_path": run_state_path.as_posix(), "status": "CONTINUE", "raw_transcript_committed": False}
          run_path.write_text(json.dumps(run, ensure_ascii=False, indent=2) + "\n")

          result_path = root / "result.json"
          result = json.loads(result_path.read_text())
          result["card_count"], result["card_order"] = len(card_ids), card_ids
          result["logical_output"] = {"path": output_path.as_posix(), "sha256": digest, "bytes": len(output_payload), "materialized_from": manifest_path.as_posix(), "committed": True, "raw_transcript_included": False}
          result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")

          readme_path = root / "README.md"
          readme = readme_path.read_text().rstrip()
          start, end = "<!-- COMPLETE_V7_1_OUTPUT_START -->", "<!-- COMPLETE_V7_1_OUTPUT_END -->"
          section = start + "\n## Complete v7.1 output\n\n- [Complete 12-card output](card-output-v7.1.md)\n- [Digest-bound card manifest](card-manifest.json)\n- [Run configuration](run.json)\n- [Replay result](result.json)\n- [Continuation state](run-state.md)\n\nRaw transcript and private acquisition evidence are intentionally excluded.\n" + end
          pattern = re.compile(re.escape(start) + ".*?" + re.escape(end), re.DOTALL)
          readme_path.write_text((pattern.sub(section, readme) if pattern.search(readme) else readme + "\n\n" + section) + "\n")
          print(json.dumps({"cards": len(card_ids), "bytes": len(output_payload), "sha256": digest}))
          PY
      - name: Verify complete output
        run: |
          python tools/materialize_card_batch.py --manifest evals/live/CvRngaQZQ3Y/card-manifest.json --output /tmp/card-output-v7.1.md --check
          cmp /tmp/card-output-v7.1.md evals/live/CvRngaQZQ3Y/card-output-v7.1.md
          pytest -q tests/test_live_cvrngaqzq3y_v7_1.py
      - name: Commit complete output
        run: |
          git add -A evals/live/CvRngaQZQ3Y
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "docs: persist complete CvRngaQZQ3Y v7.1 output"
          git push origin HEAD:agent/ai-video-transcriber-cvrngaqzq3y
