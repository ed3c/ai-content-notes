name: Materialize YouTube transcript tool

on:
  push:
    branches:
      - agent/youtube-transcript-evidence-pipeline
    paths:
      - '.bootstrap/youtube-transcript/**'
      - '.github/workflows/materialize-youtube-transcript-tool.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/youtube-transcript-evidence-pipeline
          fetch-depth: 0

      - name: Verify and materialize exact tool bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap/youtube-transcript -maxdepth 1 -type f -name 'payload.*' | wc -l | tr -d ' ')" = "3"
          cat .bootstrap/youtube-transcript/payload.* | base64 --decode > /tmp/youtube-transcript-tool.tar.xz
          echo "8d716367de4de2f3fa4cc0b25addda694e0f03ea1ee046349b5b84c9044ac837  /tmp/youtube-transcript-tool.tar.xz" | sha256sum --check --strict
          test "$(tar -tJf /tmp/youtube-transcript-tool.tar.xz)" = "tools/youtube_transcript.py"
          tar -xJf /tmp/youtube-transcript-tool.tar.xz -C "$GITHUB_WORKSPACE"
          echo "76e0be7fe138c2745cd1449b08b24cb94a63a56de9d960a7694a2ce5d6d60c3f  tools/youtube_transcript.py" | sha256sum --check --strict
          test "$(git hash-object tools/youtube_transcript.py)" = "0d53a858707ad8eb9e645f15dbf357eaa9550cad"
          rm -rf .bootstrap/youtube-transcript
          rm -f .github/workflows/materialize-youtube-transcript-tool.yml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-contracts.txt

      - name: Ruff
        run: ruff check --output-format=github tools/youtube_transcript.py tests/test_youtube_transcript.py

      - name: Python compile
        run: python -m py_compile tools/youtube_transcript.py tests/test_youtube_transcript.py

      - name: Contract tests
        run: pytest -q tests/test_youtube_transcript.py

      - name: Assert no bypass interface
        shell: bash
        run: |
          python tools/youtube_transcript.py --help > /tmp/help.txt
          ! grep -Eqi -- '--(cookie|proxy|po[-_]?token|impersonat)' /tmp/help.txt

      - name: Replace bootstrap with reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize YouTube transcript evidence tool'
          git push origin HEAD:agent/youtube-transcript-evidence-pipeline
